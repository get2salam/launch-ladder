name: Verify Launch Ladder

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node test and digest smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verification suite
        run: npm run verify

      - name: Write launch digest artifact
        run: npm run digest:artifact

      - name: Upload launch digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: launch-digest
          path: artifacts/launch-digest.txt
          if-no-files-found: error
